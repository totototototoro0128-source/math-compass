<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7862d6">
  <meta name="description" content="中学数学3年間の家庭学習アプリ。授業、問題、3段階ヒント、復習、ミニテスト、家族別の記録を収録。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>数学コンパス｜家族で学ぶ中学数学</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button id="brandHome" class="brand" type="button" aria-label="ホームに戻る"><span class="brand-icon" aria-hidden="true">✦</span><span><strong>数学コンパス</strong><small>わかるを、ひとつずつ。</small></span></button>
      <button id="profileButton" class="profile-btn" type="button"><span class="avatar" aria-hidden="true">☺</span><span id="profileName">学習者1</span><span aria-hidden="true">⌄</span></button>
    </header>
    <main id="root" class="main" tabindex="-1" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="アプリの主なメニュー">
      <button type="button" data-nav="home"><span>⌂</span>ホーム</button>
      <button type="button" data-nav="course"><span>▦</span>単元</button>
      <button type="button" data-nav="review"><span>↺</span>復習</button>
      <button type="button" data-nav="test"><span>✓</span>テスト</button>
      <button type="button" data-nav="report"><span>▥</span>記録</button>
    </nav>
  </div>
  <dialog id="profilesDialog" aria-labelledby="profilesHeading">
    <div class="dialog-pad">
      <div class="row between"><h2 id="profilesHeading">学習者の切り替え</h2><button type="button" id="closeDialog" class="close" aria-label="閉じる">×</button></div>
      <div id="profileOptions"></div>
      <form id="addProfileForm" class="dialog-form">
        <label for="addProfileName">家族を追加（6人まで）</label>
        <div class="row"><input id="addProfileName" type="text" placeholder="名前またはニックネーム" maxlength="16" required><button class="btn primary" type="submit">追加</button></div>
      </form>
    </div>
  </dialog>
  <input id="backupInput" type="file" accept=".json,application/json" hidden>
  <script src="curriculum.js"></script>
  <script src="app.js"></script>
</body>
</html>
